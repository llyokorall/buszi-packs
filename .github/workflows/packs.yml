# Builds compact timetable packs for every region whose licence allows it (Region.packAllowed)
# and publishes them as assets of the GitHub Release "packs". Free on public repositories.
# The app reads them from buszi.packsBaseUrl = https://github.com/<owner>/<repo>/releases/download/packs
name: Region packs

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PACKS_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test core
        run: ./gradlew :core:test --no-configuration-cache
      - name: Build packs
        run: ./gradlew :packbuilder:run --no-configuration-cache --args="--out ${{ github.workspace }}/out"
      - name: Publish to release "packs"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view packs >/dev/null 2>&1 || gh release create packs --title "Region packs" \
            --notes "Auto-built Buszi timetable packs. Source data and licences: see docs/COMPLIANCE.md."
          gh release upload packs out/*.db.gz out/packs.json --clobber
